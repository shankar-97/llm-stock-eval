# Model per agent, embeddings model, token budgets, cost and latency budgets.
# Swapping a model here is a config change the experiment framework can test.
#
# Model field is the short alias used to call the API. The dated ID actually served
# (response.model) is what gets persisted on every verdict/trace row -- a silent
# model update under the same alias shows up there as a new variant.

embeddings_model: null  # out of scope for the week-1 slice (no retrieval yet)

agents:
  fundamentals:
    model: claude-haiku-4-5-20251001
    token_budget: 4000
  technicals:
    model: claude-haiku-4-5-20251001
    token_budget: 2000
  news_sentiment:
    model: claude-haiku-4-5-20251001
    token_budget: 4000
  risk:
    model: claude-haiku-4-5-20251001
    token_budget: 2000
  portfolio_manager:
    model: claude-sonnet-5  # stronger model; swap to claude-opus-4-8 here if quality warrants it
    token_budget: 6000
  reviewer:
    model: claude-sonnet-5  # offline/weekly reviewer -- out of scope for the week-1 slice
    token_budget: 8000

budgets:
  p95_latency_ms_per_verdict: 15000  # placeholder -- tune after week 1 data; exclude first-call
                                      # grammar-compile latency from the measurement
  max_cost_usd_per_verdict: 0.05     # placeholder -- ~4 Haiku analyst calls + 1 Sonnet PM call

# Used to compute cost_usd from response.usage. Keyed by the DATED model ID (response.model),
# not the alias above -- verify against platform.claude.com/docs/en/about-claude/pricing before
# trusting these numbers for real budget decisions.
pricing_usd_per_mtok:
  claude-haiku-4-5-20251001: {input: 1.0, output: 5.0}
  claude-sonnet-5: {input: 2.0, output: 10.0}
  claude-opus-4-8: {input: 5.0, output: 25.0}
